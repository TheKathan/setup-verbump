name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: ["1", "1.0.1", "verbump-cli>=1,<2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The job's own python3, before
        id: before
        run: echo "python=$(command -v python3)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: setup
        with:
          version: ${{ matrix.version }}
      - name: verbump is on the PATH and the job's python3 is unchanged
        env:
          BEFORE: ${{ steps.before.outputs.python }}
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          verbump --version
          test -n "$VERSION"
          test "$(verbump --version)" = "verbump $VERSION"
          test "$(command -v python3)" = "$BEFORE"
          mkdir scratch && cd scratch && git init -q && verbump init && verbump check
